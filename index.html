<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Smart Garage - ควบคุมและรายงานสถานะ</title>
  <!-- โหลด MQTT Library -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; text-align: center; background: #eef2f5; padding-top: 40px; margin: 0; }
    .card { background: white; max-width: 400px; margin: auto; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .status-box { font-size: 20px; font-weight: bold; margin: 10px 0 20px 0; padding: 14px; border-radius: 10px; }
    .open { background: #d4edda; color: #155724; }
    .closed { background: #f8d7da; color: #721c24; }
    
    /* สไตล์กล่องสถานะที่จอดรถ */
    .parked { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .empty { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

    .section-title { font-size: 15px; font-weight: bold; color: #495057; text-align: left; margin-left: 5px; }

    button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; margin: 6px 0; border: none; border-radius: 8px; cursor: pointer; color: white; transition: 0.2s; }
    .btn-open { background: #28a745; }
    .btn-close { background: #dc3545; }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚗 Smart Garage IoT</h2>
    <p>การเชื่อมต่อ: <span id="connState" style="color: orange; font-weight: bold;">กำลังเชื่อมต่อ...</span></p>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">

    <!-- ส่วนที่ 1: สถานะที่จอดรถ -->
    <div class="section-title">🅿️ สถานะช่องจอดรถ (ไฟโรงรถ):</div>
    <div id="parkBox" class="status-box empty">กำลังตรวจสอบ...</div>

    <!-- ส่วนที่ 2: สถานะไม้กั้น -->
    <div class="section-title">🚪 สถานะไม้กั้นทางเข้า:</div>
    <div id="gateBox" class="status-box closed">กำลังโหลดสถานะ...</div>

    <!-- ปุ่มควบคุมไม้กั้น -->
    <button class="btn-open" onclick="sendCommand('OPEN')">ยกไม้กั้นขึ้น (เปิดค้าง)</button>
    <button class="btn-close" onclick="sendCommand('CLOSE')">เอาไม้กั้นลง (ปิด / ออโต้)</button>
  </div>

  <script>
    // ข้อมูลเชื่อมต่อ HiveMQ Cloud
    const brokerUrl = "wss://2e0482f82f3c4eda8299889369aac1b2.s1.eu.hivemq.cloud:8884/mqtt";
    const options = {
      username: "nattawat",
      password: "nattawat48",
      clientId: "WebController_" + Math.random().toString(16).substr(2, 8)
    };

    const client = mqtt.connect(brokerUrl, options);

    client.on('connect', () => {
      document.getElementById('connState').innerText = "เชื่อมต่อสำเร็จ";
      document.getElementById('connState').style.color = "#28a745";
      
      // สมัครรับข้อมูลทั้งสถานะไม้กั้นและสถานะที่จอดรถ
      client.subscribe("garage/gate/status");
      client.subscribe("garage/park/status");
    });

    client.on('message', (topic, message) => {
      const msg = message.toString();

      // แสดงผลสถานะไม้กั้น
      if (topic === "garage/gate/status") {
        const gateBox = document.getElementById('gateBox');
        if (msg === "OPEN") {
          gateBox.innerText = "ไม้กั้นเปิดอยู่ (OPEN)";
          gateBox.className = "status-box open";
        } else {
          gateBox.innerText = "ไม้กั้นปิดอยู่ (CLOSED)";
          gateBox.className = "status-box closed";
        }
      }

      // แสดงผลสถานะที่จอดรถ
      if (topic === "garage/park/status") {
        const parkBox = document.getElementById('parkBox');
        if (msg === "PARKED") {
          parkBox.innerText = "🚗 มีรถจอดอยู่ (ไฟดับ)";
          parkBox.className = "status-box parked";
        } else {
          parkBox.innerText = "🟢 ที่จอดว่าง (ไฟติด)";
          parkBox.className = "status-box empty";
        }
      }
    });

    function sendCommand(cmd) {
      client.publish("garage/gate/command", cmd);
    }
  </script>
</body>
</html>
